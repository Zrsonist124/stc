name: sync-upstream

on:
  schedule:
    # every day 03:00 UTC = 11:00 Beijing
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: python scripts/build_patched.py
